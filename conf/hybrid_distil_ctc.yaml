# Required overrides:
#   init_from_nemo_model
#   model.{train_ds,validation_ds}.manifest_filepath
#   model.tokenizer.path
#   model.student.language_file
# Manifests are JSONL files whose audio_filepath values use
# /path/to/shard.parquet#row=N and whose Parquet audio column contains bytes.
name: hybrid_distil_ctc
init_from_nemo_model: ???  # Initial .nemo checkpoint containing teacher/student weights.
seed: 42
torch_compile: true

model:
  sample_rate: 16000
  compute_eval_loss: false
  log_prediction: true
  skip_nan_grad: true
  training_use_cer: true  # Metric used for periodic training-batch diagnostics.
  validation_names:
    - ???
  validation_use_cer:
    - ???  # Set to false for whitespace-delimited languages where WER is preferred.
  train_ds:
    manifest_filepath:
      - ???
    sample_rate: ${model.sample_rate}
    language_drop_rate: 0.0
    language_file: ${model.student.language_file}
    never_drop_language: []
    batch_size: 2  # Increase according to available accelerator memory.
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 30
    min_duration: 0.1
    drop_last: true
    # Distillation uses a fixed 30-second input to match Whisper positional embeddings.
    audio_chunk_size: 30
    audio_chunk_step: 30
    bucket_by: audio

  validation_ds:
    manifest_filepath:
      - ???
    sample_rate: ${model.sample_rate}
    language_file: ${model.student.language_file}
    batch_size: ${model.train_ds.batch_size}
    shuffle: false
    max_duration: ${model.train_ds.max_duration}
    min_duration: ${model.train_ds.min_duration}
    num_workers: ${model.train_ds.num_workers}
    pin_memory: true
    audio_chunk_size: 30
    audio_chunk_step: 30
    bucket_by: audio

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    language_file: ${model.student.language_file}
    batch_size: ${model.train_ds.batch_size}
    max_duration: ${model.train_ds.max_duration}
    min_duration: ${model.train_ds.min_duration}
    shuffle: false
    num_workers: ${model.train_ds.num_workers}
    pin_memory: true

  tokenizer:
    path: ???  # Local Hugging Face tokenizer directory.
    blank_token: "<|endoftext|>"

  preprocessor:
    _target_: src.extractor.WhisperMelExtractor
    feature_size: 80
    sampling_rate: 16000
    hop_length: 160
    chunk_length: 30
    n_fft: 400
    padding_value: 0.0

  # Set mask counts to zero to disable spectrogram augmentation.
  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  teacher:
    _target_: src.modules.transformer_encoder.WhisperEncoder
    feat_in: ${model.preprocessor.feature_size}
    n_layers: 32
    d_model: 1280
    ff_expansion_factor: 4
    n_heads: 20
    pos_emb_max_len: 1500
    position_embedding_type: "learned"
    gradient_checkpointing: false
    pre_encode:
      layers: [1280, 1280]
      stride: [1, 2]
      kernel_size: 3
      activation: gelu

  student:
    _target_: src.modules.transformer_encoder.WhisperEncoder
    feat_in: ${model.preprocessor.feature_size}
    language_file: ???
    n_layers: 32
    d_model: 1280
    ff_expansion_factor: 4
    n_heads: 20
    pos_emb_max_len: 1500
    position_embedding_type: "alibi"
    gradient_checkpointing: false
    freeze_ffn: false
    pre_encode:
      layers: [1280, 1280, 1280]
      stride: [2, 2, 2]
      kernel_size: 3
      activation: gelu

  distil_loss:
    type: cosine
    reduction: mean
    scale: 30.0
    # Select constant or linear_decay. The decay fields are required only for
    # linear_decay and intentionally remain null in this constant-loss template.
    scale_schedule: constant
    final_scale: 0.0
    decay_start_step: null
    decay_end_step: null
    projector_activation: gelu
  # Auxiliary CTC objective retained in the converted RNN-T checkpoint.
  aux_ctc:
    ctc_loss_weight: 0.5
    decoder:
      _target_: src.modules.projection.ProjHead
      feat_in: ${model.student.d_model}
      hidden_dims:
        # Must match model.joint.jointnet.joint_hidden in the RNN-T config so the
        # trained CTC head can initialize the joiner during checkpoint conversion.
        - 690
      activation: silu
      num_classes: -1
    decoding:
      strategy: greedy_batch

  # Optional intermediate CTC supervision.
  interctc:
    loss_weights: []
    apply_at_layers: []

  optim:
    name: adamw_8bit
    lr: 1e-4
    eps: 1e-06
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: WarmupPolicy
      max_steps: 20000
      warmup_steps: 1000
      warmup_ratio: null

trainer:
  devices: 1
  num_nodes: 1
  max_epochs: -1
  max_steps: ${model.optim.sched.max_steps}
  val_check_interval: 5000
  accelerator: auto
  strategy: auto
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: bf16
  log_every_n_steps: 1000
  enable_progress_bar: true
  num_sanity_val_steps: 2
  check_val_every_n_epoch: null
  sync_batchnorm: false
  enable_checkpointing: false  # Managed by exp_manager.
  logger: false  # Managed by exp_manager.
  benchmark: false


exp_manager:
  exp_dir: exp
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_wer_ctc
    mode: min
    save_top_k: 3
    always_save_nemo: true
    every_n_train_steps: 5000
    every_n_epochs: 0
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  # Disabled by default so the template never requires external credentials.
  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${name}
    project: null  # Set when create_wandb_logger=true.
