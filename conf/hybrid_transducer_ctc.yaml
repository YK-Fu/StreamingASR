# Required overrides:
#   init_from_nemo_model
#   model.{train_ds,validation_ds}.manifest_filepath
#   model.tokenizer.path
#   model.encoder.language_file
# Manifests are JSONL files whose audio_filepath values use
# /path/to/shard.parquet#row=N and whose Parquet audio column contains bytes.
name: hybrid_transducer_ctc
init_from_nemo_model: ???  # RNN-T initialization checkpoint created by the converter.
seed: 42
torch_compile: false  # Enable after confirming that eager training works on your stack.
model:
  sample_rate: 16000
  compute_eval_loss: false
  log_prediction: true
  skip_nan_grad: true
  training_use_cer: true  # Shared by RNN-T and CTC training diagnostics.
  validation_names:
    - ???
  validation_use_cer:
    - ???  # Set to false for whitespace-delimited languages where WER is preferred.
  train_ds:
    manifest_filepath:
      - ???
    sample_rate: ${model.sample_rate}
    language_file: ${model.encoder.language_file}
    # Optional waveform augmentation, applied before spectrogram augmentation.
    augmentation:
      enabled: false
      noise:
        # Noise manifests use the same Parquet-backed JSONL format as train_ds.
        noise_manifests: []
        prob: 0.2
        min_snr_db: 5
        max_snr_db: 20
      effects:
        volume: {prob: 0.05, min_db: -10, max_db: 10}
        blur: {prob: 0.05, kernel_size: 10}
        echo: {prob: 0.05, delay_ms: 20, decay: 0.3}
        smoothing: {prob: 0.05, segment_ms: 10}
        pitch: {prob: 0.03, min_semitones: -2, max_semitones: 2}
    batch_size: 2  # Increase according to available accelerator memory.
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 30
    min_duration: 0.1
    drop_last: true
    text_bucket_size: 64  # Stabilizes compiled decoder shapes when enabled.
    max_context_tokens: 256
    audio_chunk_size: 30
    audio_chunk_step: 5
    bucket_by: audio
  validation_ds:
    manifest_filepath:
      - ???
    sample_rate: ${model.sample_rate}
    language_file: ${model.encoder.language_file}
    batch_size: ${model.train_ds.batch_size}
    shuffle: false
    max_duration: ${model.train_ds.max_duration}
    min_duration: ${model.train_ds.min_duration}
    num_workers: ${model.train_ds.num_workers}
    pin_memory: true
    audio_chunk_size: ${model.train_ds.audio_chunk_size}
    audio_chunk_step: ${model.train_ds.audio_chunk_step}
    max_context_tokens: ${model.train_ds.max_context_tokens}
    bucket_by: audio
  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    language_file: ${model.encoder.language_file}
    batch_size: ${model.train_ds.batch_size}
    max_duration: ${model.train_ds.max_duration}
    min_duration: ${model.train_ds.min_duration}
    shuffle: false
    num_workers: ${model.train_ds.num_workers}
    pin_memory: true

  tokenizer:
    path: ???  # Local Hugging Face tokenizer directory.
    blank_token: "<|endoftext|>"

  preprocessor:
    _target_: src.extractor.WhisperMelExtractor
    feature_size: 80
    sampling_rate: 16000
    hop_length: 160
    chunk_length: 30
    n_fft: 400
    padding_value: 0.0

  # Set mask counts to zero to disable spectrogram augmentation.
  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: src.modules.transformer_encoder.WhisperEncoder
    feat_in: ${model.preprocessor.feature_size}
    language_file: ???
    n_layers: 32
    d_model: 1280
    ff_expansion_factor: 4
    n_heads: 20
    pos_emb_max_len: 1500
    position_embedding_type: "alibi"
    gradient_checkpointing: false
    freeze: false
    freeze_ffn: false
    pre_encode:
      layers: [1280, 1280, 1280]
      stride: [2, 2, 2]
      kernel_size: 3
      activation: gelu

  decoder:
    _target_: src.modules.transformer_decoder.LLMDecoder
    gradient_checkpointing: false
    freeze: false
    freeze_ffn: false
    config:
      _target_: transformers.Qwen2Config
      hidden_size: 896
      intermediate_size: 4864
      num_hidden_layers: 24
      num_attention_heads: 14
      num_key_value_heads: 2
      hidden_act: silu
      max_position_embeddings: 32768
      rope_theta: 1000000
      rope_scaling: null
      attention_bias: false
      attention_dropout: 0.0
      mlp_bias: false
      attn_implementation: eager
      tie_word_embeddings: true

  # Projections used to select the pruned RNN-T lattice.
  simple_am_proj:
    _target_: src.modules.projection.ProjHead
    feat_in: ${model.encoder.d_model}
    hidden_dims:
      - ${model.joint.jointnet.joint_hidden}
    activation: silu
    num_classes: -1

  simple_lm_proj:
    _target_: src.modules.projection.ProjHead
    feat_in: ${model.decoder.config.hidden_size}
    hidden_dims: []
    num_classes: -1

  joint:
    _target_: src.modules.projection.PrunedRNNTJoint
    log_softmax: null
    preserve_memory: false

    fuse_loss_wer: true
    fused_batch_size: ${model.train_ds.batch_size}

    jointnet:
      joint_hidden: 690
      activation: silu
      dropout: 0.05

  decoding:
    strategy: LoopLabel
    max_length: 128  # Total decoder-cache budget: prompt plus emitted tokens.
    prefill_bucket_size: 64
    max_symbols_per_step: 3
  aux_llm:
    llm_loss_weight: 0.1

  # Predictor-context augmentation. The CTC ratio is sampled per utterance;
  # optional manual deletion is applied afterward to either the selected CTC
  # history or the clean history. RNN-T, LM, and CTC targets always stay clean.
  token_augmentation:
    ctc_history:
      enabled: false
      sample_ratio: 0.0
      warmup_steps: 3000
      ramp_steps: 2000
    context_deletion:
      enabled: false
      probability: 0.0

  # Auxiliary CTC objective used jointly with the RNN-T loss.
  aux_ctc:
    ctc_loss_weight: 0.3
    decoder:
      _target_: src.modules.projection.ProjHead
      feat_in: ${model.encoder.d_model}
      hidden_dims:
        - ${model.joint.jointnet.joint_hidden}
      activation: silu
      num_classes: -1
    decoding:
      strategy: greedy_batch

  # CTC-guided frame reduction for the RNN-T path. CTC itself continues to use
  # the full encoder sequence. Disable this block to recover the legacy path.
  ctc_pruning:
    frame:
      enabled: true
      blank_threshold: 0.95
      lconv_kernel_size: 7
      lconv_expansion: 2

  # Optional intermediate CTC supervision.
  interctc:
    loss_weights: []
    apply_at_layers: []

  loss:
    lm_only_scale: 0.25
    am_only_scale: 0.0
    delay_penalty: 0.0
    fastemit_lambda: 0.008  # Nonblank gradients are scaled by 1 + this value.
    s_range: 4
    loss_warm_steps: 3000

  optim:
    name: adamw_8bit
    lr: 1e-4
    eps: 1e-8
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: CosineAnnealing
      max_steps: 100000
      min_lr: 1e-6
      warmup_steps: 5000
      warmup_ratio: null

trainer:
  devices: 1
  num_nodes: 1
  max_epochs: -1
  max_steps: ${model.optim.sched.max_steps}
  val_check_interval: 5000
  accelerator: auto
  strategy: auto
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: bf16
  log_every_n_steps: 100
  enable_progress_bar: true
  num_sanity_val_steps: 2
  check_val_every_n_epoch: null
  limit_val_batches: 1.0
  sync_batchnorm: false
  enable_checkpointing: false  # Managed by exp_manager.
  logger: false  # Managed by exp_manager.
  benchmark: false


exp_manager:
  exp_dir: experiments
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_wer
    mode: min
    save_top_k: 5
    always_save_nemo: true
    every_n_train_steps: 5000
    every_n_epochs: 0
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  # Disabled by default so the template never requires external credentials.
  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${name}
    project: null  # Set when create_wandb_logger=true.
